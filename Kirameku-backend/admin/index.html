<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Kirameku 后台管理</title>
    <link rel="icon" href="/icon.png" />
  </head>

  <body>
    <div id="app">
      <style>
        html,
        body,
        #app {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #edf3f6;
        }

        .loader {
          width: 34px;
          height: 34px;
          border: 3px solid rgb(14 165 233 / 18%);
          border-top-color: #0ea5e9;
          border-radius: 50%;
          animation: load-animation 0.8s linear infinite;
        }

        @keyframes load-animation {
          to {
            transform: rotate(360deg);
          }
        }

        @media (prefers-color-scheme: dark) {
          html,
          body,
          #app {
            background: #0b111b;
          }
        }
      </style>
      <div class="loader"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
